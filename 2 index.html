```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎂 </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Birthday Card */
        .card {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            color: white;
            z-index: 10;
            animation: cardAppear 1.5s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.7) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .cake {
            font-size: 75px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        h1 {
            font-size: clamp(2.2rem, 10vw, 4rem);
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        h2 {
            font-size: clamp(1.3rem, 6vw, 2rem);
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .wish {
            font-size: 1.15rem;
        }

        button {
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #d63384;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Balloons */
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 60px;
            height: 75px;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0.8;
        }

        .balloon::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 100px;
            background: white;
            left: 50%;
            top: 70px;
        }

        .b1 {
            left: 8%;
            background: #ff4757;
            animation-duration: 9s;
        }

        .b2 {
            left: 25%;
            background: #2ed573;
            animation-duration: 12s;
            animation-delay: 2s;
        }

        .b3 {
            right: 25%;
            background: #1e90ff;
            animation-duration: 10s;
            animation-delay: 1s;
        }

        .b4 {
            right: 8%;
            background: #ffa502;
            animation-duration: 13s;
            animation-delay: 3s;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(-5deg);
            }
            50% {
                transform: translateY(-55vh) rotate(5deg);
            }
            100% {
                transform: translateY(-120vh) rotate(-5deg);
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 10px;
            z-index: 20;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .card {
                padding: 30px 18px;
            }

            .cake {
                font-size: 60px;
            }

            p {
                font-size: 1rem;
            }

            button {
                width: 85%;
                padding: 13px;
            }

            .balloon {
                width: 45px;
                height: 60px;
            }
        }
    </style>
</head>

<body>

    <!-- Balloons -->
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>

    <!-- Birthday Card -->
    <div class="card">
        <div class="cake">🎂</div>

        <h1>Happy Birthday!</h1>

        <h2>🎉 AMULYA 🎉</h2>

        <p class="wish">
            May your birthday be filled with happiness, and
            beautiful memories and lots of love! 💖
        </p>

        <p>
            ✨ May all your dreams come true! ✨ 
        </p>

        <button onclick="celebrate()">
            🎊 Celebrate 🎊
        </button>
    </div>

    <script>
        function createConfetti() {

            const colors = [
                "#ff4757",
                "#ffa502",
                "#2ed573",
                "#1e90ff",
                "#e84393",
                "#f1c40f",
                "#ffffff"
            ];

            for (let i = 0; i < 120; i++) {

                const confetti = document.createElement("div");

                confetti.classList.add("confetti");

                confetti.style.left = Math.random() * 100 + "vw";

                confetti.style.backgroundColor =
                    colors[Math.floor(Math.random() * colors.length)];

                confetti.style.width =
                    Math.random() * 8 + 5 + "px";

                confetti.style.height =
                    Math.random() * 12 + 5 + "px";

                confetti.style.animationDuration =
                    Math.random() * 3 + 2 + "s";

                confetti.style.animationDelay =
                    Math.random() * 1.5 + "s";

                confetti.style.transform =
                    `rotate(${Math.random() * 360}deg)`;

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 6000);
            }
        }

        function celebrate() {
            createConfetti();
        }

        // Start confetti automatically
        window.onload = function () {
            createConfetti();

            // Repeat celebration
            setInterval(createConfetti, 7000);
        };
    </script>

</body>
</html>
